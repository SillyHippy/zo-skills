<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zo Snapshot Inspector</title>
  <!-- diff2html & highlight.js styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --sidebar: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --accent: #58a6ff;
      --green: #238636;
      --red: #da3633;
      --orange: #d29922;
      --card: #21262d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Mobile Navigation Bar */
    #mobile-bar {
      display: none;
      background: var(--sidebar);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .mobile-tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .mobile-tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    /* Layout */
    #sidebar {
      width: 340px;
      min-width: 300px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: var(--green);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: var(--card);
      border-color: var(--border);
      color: var(--text-bright);
    }
    #snapshot-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
      -webkit-overflow-scrolling: touch;
    }
    .snap-item {
      padding: 12px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 6px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .snap-item:hover { background: var(--card); }
    .snap-item.active {
      background: var(--card);
      border-color: var(--accent);
    }
    .snap-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .snap-meta {
      font-size: 11px;
      color: #8b949e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      background: rgba(88,166,255,0.15);
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
    }
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
    }
    #diff-toolbar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--sidebar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    #diff-info {
      font-size: 13px;
      color: var(--text-bright);
      font-weight: 500;
    }
    #diff-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #diff-summary-badges {
      display: flex;
      gap: 8px;
    }
    .tag-add { color: #3fb950; font-weight: 600; font-size: 12px; }
    .tag-mod { color: #d29922; font-weight: 600; font-size: 12px; }
    .tag-del { color: #f85149; font-weight: 600; font-size: 12px; }
    #diff-container {
      flex: 1;
      overflow: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    /* diff2html dark theme overrides */
    .d2h-file-wrapper {
      border: 1px solid var(--border) !important;
      margin-bottom: 24px !important;
      border-radius: 6px !important;
      overflow: hidden !important;
      background: var(--sidebar) !important;
    }
    .d2h-file-header {
      background: var(--card) !important;
      border-bottom: 1px solid var(--border) !important;
      color: var(--text-bright) !important;
      padding: 10px 14px !important;
    }
    .d2h-file-name { color: var(--text-bright) !important; font-weight: 600 !important; }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #8b949e;
      font-size: 14px;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }

    /* Responsive Mobile Overrides */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      #mobile-bar {
        display: flex;
      }
      #sidebar {
        width: 100%;
        min-width: 100%;
        height: calc(100vh - 50px);
        display: flex;
      }
      #main {
        width: 100%;
        height: calc(100vh - 50px);
        display: none;
      }
      body.show-diff #sidebar {
        display: none;
      }
      body.show-diff #main {
        display: flex;
      }
      .d2h-code-side-line, .d2h-code-line {
        font-size: 11px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Top bar on mobile devices -->
  <div id="mobile-bar">
    <div style="font-weight: 700; font-size: 14px; color: var(--text-bright);">⚡ Zo Snapshot</div>
    <div style="display: flex; gap: 8px;">
      <button id="tab-snaps" class="mobile-tab-btn active" onclick="showTab('snaps')">Checkpoints</button>
      <button id="tab-diff" class="mobile-tab-btn" onclick="showTab('diff')">Diff View</button>
    </div>
  </div>

  <!-- Left Sidebar -->
  <div id="sidebar">
    <div id="header">
      <h1>⚡ Zo Snapshot</h1>
      <button class="btn" onclick="takeSnapshot()">+ Checkpoint</button>
    </div>
    <div id="snapshot-list">
      <div style="padding: 20px; text-align: center; color: #8b949e; font-size: 13px;">Loading snapshots...</div>
    </div>
  </div>

  <!-- Main View -->
  <div id="main">
    <div id="diff-toolbar">
      <div id="diff-info">Select a snapshot to inspect diffs against live state</div>
      <div id="diff-actions" style="display: none;">
        <div id="diff-summary-badges"></div>
        <button class="btn btn-secondary" onclick="restoreSnapshot(true)">Dry-Run</button>
        <button class="btn" style="background: var(--red);" onclick="restoreSnapshot(false)">Roll Back</button>
      </div>
    </div>
    <div id="diff-container">
      <div class="empty-state">
        <div>🔍 Select a snapshot from the list to view GitHub-style line-by-line diffs.</div>
      </div>
    </div>
  </div>

  <script>
    // Determine base URL dynamically (handles direct :3090 and reverse proxy /snapshot)
    const BASE_URL = window.location.pathname.startsWith('/snapshot') ? '/snapshot' : '';
    let activeSnapshotId = null;
    let currentDiffData = null;

    function showTab(tab) {
      document.getElementById("tab-snaps").classList.toggle("active", tab === 'snaps');
      document.getElementById("tab-diff").classList.toggle("active", tab === 'diff');
      if (tab === 'snaps') {
        document.body.classList.remove("show-diff");
      } else {
        document.body.classList.add("show-diff");
      }
    }

    async function loadSnapshots() {
      const listEl = document.getElementById("snapshot-list");
      try {
        const res = await fetch(`${BASE_URL}/api/snapshots`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const snapshots = await res.json();
        listEl.innerHTML = "";

        if (!snapshots.length) {
          listEl.innerHTML = `<div style="padding: 20px; text-align: center; color: #8b949e;">No snapshots found.</div>`;
          return;
        }

        snapshots.forEach((snap, idx) => {
          const div = document.createElement("div");
          div.className = "snap-item" + (idx === 0 ? " active" : "");
          const dateStr = snap.created_at.replace("T", " ").substring(0, 19);
          div.innerHTML = `
            <div class="snap-label" title="${snap.label}">${snap.label}</div>
            <div class="snap-meta">
              <span>${dateStr}</span>
              <span class="badge">${snap.scope} · ${snap.file_count}f</span>
            </div>
          `;
          div.onclick = () => {
            selectSnapshot(snap.id, div);
            if (window.innerWidth <= 768) {
              showTab('diff');
            }
          };
          listEl.appendChild(div);
        });

        if (snapshots.length) {
          selectSnapshot(snapshots[0].id, listEl.children[0]);
        }
      } catch (err) {
        listEl.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--red);">Failed to connect: ${err.message}</div>`;
        console.error("Failed to load snapshots:", err);
      }
    }

    async function selectSnapshot(id, el) {
      activeSnapshotId = id;
      document.querySelectorAll(".snap-item").forEach(item => item.classList.remove("active"));
      if (el) el.classList.add("active");

      document.getElementById("diff-info").innerText = `Comparing: ${id} ➔ Live State...`;
      document.getElementById("diff-actions").style.display = "none";
      document.getElementById("diff-container").innerHTML = `<div class="empty-state">Loading unified diff...</div>`;

      try {
        const res = await fetch(`${BASE_URL}/api/snapshots/diff?from=${id}&to=current`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        currentDiffData = data;

        document.getElementById("diff-info").innerText = `Comparing: ${data.from} ➔ Live System`;
        document.getElementById("diff-actions").style.display = "flex";

        const summary = data.summary;
        document.getElementById("diff-summary-badges").innerHTML = `
          <span class="tag-add">+${summary.added_count} add</span>
          <span class="tag-mod">~${summary.modified_count} mod</span>
          <span class="tag-del">-${summary.deleted_count} del</span>
        `;

        renderDiff(data);
      } catch (err) {
        document.getElementById("diff-container").innerHTML = `<div class="empty-state" style="color: var(--red);">Failed to load diff: ${err.message}</div>`;
      }
    }

    function renderDiff(diffData) {
      const container = document.getElementById("diff-container");
      const diffStrings = Object.values(diffData.diffs || {}).join("\n\n");

      if (!diffStrings.trim()) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="color: #3fb950; font-size: 32px;">✓</div>
            <div style="font-weight: 600; color: var(--text-bright);">No changes detected!</div>
            <div>All files in this snapshot match current live state exactly.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = "";
      const isMobile = window.innerWidth <= 768;
      const diff2htmlUi = new Diff2HtmlUI(container, diffStrings, {
        outputFormat: isMobile ? 'line-by-line' : 'side-by-side',
        drawFileList: true,
        matching: 'lines',
        colorScheme: 'dark'
      });
      diff2htmlUi.draw();
      diff2htmlUi.highlightCode();
    }

    async function takeSnapshot() {
      const label = prompt("Enter checkpoint label:", "Manual Checkpoint");
      if (!label) return;

      const btn = document.querySelector("#header .btn");
      btn.innerText = "Saving...";
      btn.disabled = true;

      try {
        const res = await fetch(`${BASE_URL}/api/snapshots`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ label, scope: "vps" })
        });
        const result = await res.json();
        alert(`✓ Snapshot created: ${result.id}\nFiles: ${result.file_count}`);
        loadSnapshots();
      } catch (err) {
        alert(`Failed to create snapshot: ${err.message}`);
      } finally {
        btn.innerText = "+ Checkpoint";
        btn.disabled = false;
      }
    }

    async function restoreSnapshot(dryRun) {
      if (!activeSnapshotId) return;
      const mode = dryRun ? "Dry-Run Simulation" : "LIVE ROLLBACK";
      if (!confirm(`Are you sure you want to perform a ${mode} from ${activeSnapshotId}?`)) return;

      try {
        const res = await fetch(`${BASE_URL}/api/snapshots/restore`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: activeSnapshotId, dry_run: dryRun })
        });
        const result = await res.json();
        if (result.error) {
          alert(`Error: ${result.error}`);
        } else {
          const prefix = dryRun ? "[Dry Run] " : "[Restored] ";
          alert(`${prefix}Targeted ${result.restored_count} files.\nSafety Snapshot: ${result.safety_snapshot_id || 'None'}`);
          if (!dryRun) {
            selectSnapshot(activeSnapshotId);
          }
        }
      } catch (err) {
        alert(`Restore call failed: ${err.message}`);
      }
    }

    window.onload = loadSnapshots;
  </script>
</body>
</html>
