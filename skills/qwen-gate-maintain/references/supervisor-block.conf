[program:qwen-gate]
command=bash -c 'cd /home/workspace/Projects/qwen-gate && bun src/index.tsx --host 0.0.0.0'
directory=/home/workspace/Projects/qwen-gate
environment=
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
startretries=20
startsecs=5
stdout_logfile=/dev/shm/qwen-gate.log
stderr_logfile=/dev/shm/qwen-gate_err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
killasgroup=true
stopwaitsecs=4
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5