<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Share</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 500px; width: 100%; padding: 40px; }
    h1 { font-size: 28px; margin-bottom: 8px; color: #fff; }
    .subtitle { color: #888; margin-bottom: 32px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    select, input { width: 100%; padding: 12px 16px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 15px; outline: none; transition: border-color 0.2s; }
    select:focus, input:focus { border-color: #666; }
    select option { background: #1a1a1a; color: #fff; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #fff; color: #000; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .message { margin-top: 20px; padding: 14px 16px; border-radius: 8px; font-size: 14px; display: none; }
    .message.success { display: block; background: #0d2818; border: 1px solid #1a5c32; color: #4ade80; }
    .message.error { display: block; background: #2d0a0a; border: 1px solid #5c1a1a; color: #f87171; }
    .message.info { display: block; background: #0a1a2d; border: 1px solid #1a3a5c; color: #60a5fa; }
    .loading { text-align: center; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📁 File Share</h1>
    <p class="subtitle">Select a file and enter your email to request access.</p>

    <div id="loading" class="loading">Loading files...</div>

    <form id="form" style="display:none">
      <div class="form-group">
        <label>File</label>
        <select id="fileSelect" required></select>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" id="submitBtn">Request Access</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script>
    const API = '';

    async function loadFiles() {
      try {
        const res = await fetch(`${API}/files`);
        const files = await res.json();
        const select = document.getElementById('fileSelect');
        select.innerHTML = '';
        if (files.length === 0) {
          document.getElementById('loading').textContent = 'No files available for sharing.';
          return;
        }
        files.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.id;
          opt.textContent = f.name;
          select.appendChild(opt);
        });
        document.getElementById('loading').style.display = 'none';
        document.getElementById('form').style.display = 'block';
      } catch (e) {
        document.getElementById('loading').textContent = 'Failed to load files.';
      }
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      const file_id = parseInt(document.getElementById('fileSelect').value);
      const email = document.getElementById('email').value;

      try {
        const res = await fetch(`${API}/request-access`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, file_id })
        });
        const data = await res.json();
        const msg = document.getElementById('message');

        if (res.ok) {
          msg.className = 'message success';
          msg.textContent = data.message;
        } else {
          msg.className = 'message error';
          msg.textContent = data.error || 'Something went wrong.';
        }
      } catch (err) {
        const msg = document.getElementById('message');
        msg.className = 'message error';
        msg.textContent = 'Network error. Please try again.';
      }

      btn.disabled = false;
      btn.textContent = 'Request Access';
    });

    loadFiles();
  </script>
</body>
</html>
